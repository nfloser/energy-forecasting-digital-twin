name: Full real-data evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Download real data and run chronological evaluation
        run: energy-twin demo --data-dir data --start-date 2009-01-01 --end-date 2009-03-31
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-evaluation
          path: |
            data/evaluation.json
            data/quality.json
            data/provenance.json
            data/forecast.json
            data/models/*.json
          retention-days: 30
