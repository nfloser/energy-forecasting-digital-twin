name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=energy_twin --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_ci_fixture.py --output data
      - run: |
          uvicorn energy_twin.api:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/energy-twin.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/metrics
          curl --fail http://127.0.0.1:8000/provenance
          kill "$(cat /tmp/energy-twin.pid)"

  containers:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
